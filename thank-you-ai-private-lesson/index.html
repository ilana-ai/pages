<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>תודה שנרשמת! — שיעור פרטי ב-AI</title>
  <meta name="description" content="נרשמת לשיעור פרטי ב-AI עם החיים הטובים. כמה משימות מקדימות לפני הפגישה." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #2b2431;
      --muted: #746b7e;
      --line: #efe6f1;
      --link: #e0568a;
      --card: #ffffff;
      --soft: #f9f2fb;
      --maxw: 640px;
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: clamp(20px, 5vw, 48px);
      color: var(--ink);
      font-family: "Heebo", -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      font-size: 16px;
      line-height: 1.55;
      background: linear-gradient(160deg, #fff5ee 0%, #ffe8e0 42%, #f5e9ff 100%);
      background-attachment: fixed;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    /* עיטורי רקע רכים */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(70px);
      z-index: 0;
      pointer-events: none;
    }
    .blob--1 { width: 340px; height: 340px; top: -90px; inset-inline-end: -80px; background: rgba(255, 138, 101, .45); }
    .blob--2 { width: 320px; height: 320px; bottom: -100px; inset-inline-start: -90px; background: rgba(184, 142, 255, .40); }

    .page {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: var(--maxw);
      text-align: center;
    }

    .card {
      background: var(--card);
      border-radius: clamp(20px, 4vw, 28px);
      padding: clamp(30px, 6vw, 56px);
      box-shadow:
        0 20px 50px -18px rgba(90, 45, 70, .22),
        0 6px 18px -8px rgba(90, 45, 70, .12);
      animation: rise .6s cubic-bezier(.2, .7, .2, 1) both;
    }

    .badge {
      width: 78px;
      height: 78px;
      margin: 0 auto;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #ff9a6c 0%, #ff6f91 100%);
      box-shadow: 0 12px 26px -8px rgba(255, 111, 145, .6);
      animation: pop .5s .15s cubic-bezier(.2, 1.3, .4, 1) both;
    }
    .badge svg {
      width: 40px;
      height: 40px;
      fill: none;
      stroke: #fff;
      stroke-width: 2.6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .hero {
      margin: 24px 0 0;
      font-size: clamp(23px, 4.6vw, 33px);
      font-weight: 800;
      line-height: 1.4;
      letter-spacing: -0.01em;
    }

    .sub {
      margin: 16px auto 0;
      max-width: 44ch;
      font-size: clamp(16px, 2.2vw, 17.5px);
      line-height: 1.6;
      color: var(--muted);
    }

    .divider {
      height: 1px;
      background: var(--line);
      margin: clamp(28px, 5vw, 38px) 0;
      border: 0;
    }

    .tasks { text-align: start; }
    .tasks h2 {
      margin: 0;
      font-size: clamp(18px, 3vw, 21px);
      font-weight: 700;
      text-align: center;
    }

    /* Placeholder — יוחלף בתוכן המשימות */
    .soon {
      margin-top: 18px;
      padding: 22px 20px;
      background: var(--soft);
      border: 1px solid var(--line);
      border-radius: 16px;
      text-align: center;
      color: var(--muted);
      font-size: 15px;
    }

    .brand {
      margin-top: 22px;
      color: #9b93a5;
      font-size: 13px;
      letter-spacing: .04em;
    }

    @media (max-width: 480px) {
      body { font-size: 15.5px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .card, .badge { animation: none; }
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes pop {
      from { opacity: 0; transform: scale(.6); }
      to   { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>
  <div class="blob blob--1"></div>
  <div class="blob blob--2"></div>

  <main class="page">
    <div class="card">
      <div class="badge" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M5 12.5l4.2 4.2L19 7" /></svg>
      </div>

      <h1 class="hero">היי, איזה כיף שנרשמת לשיעור הפרטי! ❤️😊 אני מצפה לפגוש אותך ולהתחיל לבנות חיים יעילים וכיפים יותר.</h1>

      <p class="sub">בשביל להוציא את המקסימום מהפגישה שלנו, הכנתי בשבילך כמה משימות מקדימות שכדאי שתעשי לפני השיעור.</p>

      <hr class="divider" />

      <!-- ============================================================ -->
      <!-- משימות מקדימות — התוכן ייכנס כאן (אילנה תיתן את הטקסט)        -->
      <!-- ============================================================ -->
      <section class="tasks">
        <h2>משימות מקדימות</h2>
        <div class="soon">התוכן יתווסף כאן ממש בקרוב 🌱</div>
      </section>
    </div>

    <div class="brand">החיים הטובים</div>
  </main>
</body>
</html>
